# 無料枠。投稿の実体はサーバーのディスクではなく Supabase 無料枠に残す。
services:
  - type: web
    name: school-festival-exhibition
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: REQUIRE_REMOTE_STORE
        value: "1"
      - key: SUPABASE_BUCKET
        value: exhibition
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
